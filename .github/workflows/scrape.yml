name: Kuuma bezetting scraper

on:
  workflow_dispatch:        # handmatig starten (voor testen)
  schedule:
    # GitHub-cron draait in UTC (zomertijd): 01:00=03:00, 10:00=12:00, 15:00=17:00 Amsterdam.
    # In wintertijd schuift dit 1 uur; zie README als je dat exact wilt houden.
    - cron: "0 1 * * *"    # ochtend — hele dag
    - cron: "0 10 * * *"   # middag — update
    - cron: "0 15 * * *"   # avond — completere eindstand

concurrency:
  group: kuuma-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Draai scraper (headed via xvfb)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          export TARGET_DATE="$(TZ=Europe/Amsterdam date +%F)"
          H="$(TZ=Europe/Amsterdam date +%H)"
          # stabiel meetmoment: 03:00='ochtend' (hele dag), 12:00='middag', 17:00='avond' (update).
          # Alleen 'ochtend' legt de vooraf-stand vast; middag/avond werken de laatste stand bij.
          if [ "$H" -lt 8 ]; then export RUN_LABEL="ochtend";
          elif [ "$H" -lt 15 ]; then export RUN_LABEL="middag";
          else export RUN_LABEL="avond"; fi
          echo "Datum $TARGET_DATE, meetmoment $RUN_LABEL ($(TZ=Europe/Amsterdam date +%H:%M))"
          # Bookeo blokkeert headless -> headed browser onder een virtueel scherm (xvfb)
          xvfb-run -a python scrape.py

      - name: Bewaar debug-output (indien aanwezig)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
