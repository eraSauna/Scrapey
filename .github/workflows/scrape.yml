name: Kuuma bezetting scraper

on:
  workflow_dispatch:        # handmatig starten (voor testen)
  schedule:
    # GitHub-cron draait in UTC (zomertijd): 02:00=04:00, 13:00=15:00 Amsterdam.
    # Ochtend bewust vroeg (04:00) zodat 'ie ook mét cron-vertraging vóór het eerste slot draait
    # en de hele dag pakt. In wintertijd schuift dit 1 uur; zie README.
    - cron: "0 2 * * *"    # ochtend (04:00) — hele dag
    - cron: "0 13 * * *"   # middag (15:00) — update

concurrency:
  group: kuuma-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HC_PING_URL: ${{ secrets.HC_PING_URL }}   # healthchecks.io ping-URL (leeg = uit)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draai Kuuma Periode-scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCHEDULE: ${{ github.event.schedule }}   # welke cron triggerde (leeg bij handmatig)
        run: |
          export TARGET_DATE="$(TZ=Europe/Amsterdam date +%F)"
          # Meetmoment bepalen op WELKE cron 'm triggerde (niet op de klok), zodat een late
          # start het label niet verschuift. Alleen 'ochtend' legt de vooraf-stand vast.
          case "$SCHEDULE" in
            "0 2 * * *")  RL="ochtend" ;;
            "0 13 * * *") RL="middag" ;;
            *)  # handmatige run: val terug op de klok (ruime ochtend-marge)
                H="$(TZ=Europe/Amsterdam date +%H)"
                if [ "$H" -lt 10 ]; then RL="ochtend"; else RL="middag"; fi ;;
          esac
          export RUN_LABEL="$RL"
          echo "Datum $TARGET_DATE, meetmoment $RUN_LABEL (schedule='$SCHEDULE', $(TZ=Europe/Amsterdam date +%H:%M))"
          python periode.py

      - name: Healthcheck OK
        if: success() && env.HC_PING_URL != ''
        run: curl -fsS --max-time 15 --retry 3 "${HC_PING_URL%/}" || true

      - name: Healthcheck FAIL (mailt ook bij timeout/annulering)
        if: (failure() || cancelled()) && env.HC_PING_URL != ''
        run: curl -fsS --max-time 15 --retry 3 "${HC_PING_URL%/}/fail" || true
