name: Kuuma bezetting scraper

on:
  workflow_dispatch:        # handmatig starten (voor testen)
  schedule:
    # GitHub-cron draait in UTC (zomertijd): 02:00=04:00, 10:00=12:00, 15:00=17:00 Amsterdam.
    # Ochtend bewust vroeg (04:00) zodat 'ie ook mét cron-vertraging vóór het eerste slot draait
    # en de hele dag pakt. In wintertijd schuift dit 1 uur; zie README.
    - cron: "0 2 * * *"    # ochtend — hele dag
    - cron: "0 10 * * *"   # middag — update
    - cron: "0 15 * * *"   # avond — completere eindstand

concurrency:
  group: kuuma-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HC_PING_URL: ${{ secrets.HC_PING_URL }}   # healthchecks.io ping-URL (leeg = uit)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Draai scraper (headed via xvfb)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCHEDULE: ${{ github.event.schedule }}   # welke cron triggerde (leeg bij handmatig)
        run: |
          export TARGET_DATE="$(TZ=Europe/Amsterdam date +%F)"
          # Meetmoment bepalen op WELKE cron 'm triggerde (niet op de klok), zodat een late
          # start het label niet verschuift. Alleen 'ochtend' legt de vooraf-stand vast.
          case "$SCHEDULE" in
            "0 2 * * *")  RL="ochtend" ;;
            "0 10 * * *") RL="middag" ;;
            "0 15 * * *") RL="avond" ;;
            *)  # handmatige run: val terug op de klok (ruime ochtend-marge)
                H="$(TZ=Europe/Amsterdam date +%H)"
                if [ "$H" -lt 10 ]; then RL="ochtend"; elif [ "$H" -lt 15 ]; then RL="middag"; else RL="avond"; fi ;;
          esac
          export RUN_LABEL="$RL"
          echo "Datum $TARGET_DATE, meetmoment $RUN_LABEL (schedule='$SCHEDULE', $(TZ=Europe/Amsterdam date +%H:%M))"
          # Bookeo blokkeert headless -> headed browser onder een virtueel scherm (xvfb)
          xvfb-run -a python scrape.py

      - name: Healthcheck OK
        if: success() && env.HC_PING_URL != ''
        run: curl -fsS --max-time 15 --retry 3 "${HC_PING_URL%/}" || true

      - name: Healthcheck FAIL (mailt bij storing)
        if: failure() && env.HC_PING_URL != ''
        run: curl -fsS --max-time 15 --retry 3 "${HC_PING_URL%/}/fail" || true

      - name: Bewaar debug-output (indien aanwezig)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
