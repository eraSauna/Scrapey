name: Big Billies bezetting scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"    # ochtend: 04:00 Amsterdam in zomertijd
    - cron: "0 13 * * *"   # middag: 15:00 Amsterdam in zomertijd

concurrency:
  group: billies-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HC_PING_URL: ${{ secrets.HC_PING_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Draai Big Billies-scraper
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          DEBUG: "1"
        run: |
          export TARGET_DATE="$(TZ=Europe/Amsterdam date +%F)"
          case "$SCHEDULE" in
            "0 2 * * *")  RL="ochtend" ;;
            "0 13 * * *") RL="middag" ;;
            *)
              H="$(TZ=Europe/Amsterdam date +%H)"
              if [ "$H" -lt 10 ]; then RL="ochtend"; else RL="middag"; fi ;;
          esac
          export RUN_LABEL="$RL"
          echo "Datum $TARGET_DATE, meetmoment $RUN_LABEL"
          xvfb-run -a python billies.py

      - name: Healthcheck OK
        if: success() && env.HC_PING_URL != ''
        run: curl -fsS --max-time 15 --retry 3 "${HC_PING_URL%/}" || true

      - name: Healthcheck FAIL
        if: failure() && env.HC_PING_URL != ''
        run: curl -fsS --max-time 15 --retry 3 "${HC_PING_URL%/}/fail" || true

      - name: Bewaar debug-output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billies-debug
          path: debug/
          if-no-files-found: ignore
